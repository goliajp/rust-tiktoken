name: release

on:
  push:
    tags:
      - 'v*'                    # → publish tiktoken crate
      - 'tiktoken-wasm-v*'      # → publish tiktoken-wasm crate + npm

jobs:
  publish-tiktoken:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: publish to crates.io
        run: |
          set +e
          out=$(cargo publish -p tiktoken --token ${{ secrets.CRATES_IO_TOKEN }} 2>&1)
          rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && echo "$out" | grep -q "already exists on crates.io"; then
            echo "::notice::tiktoken version already published, treating as success"
            exit 0
          fi
          exit $rc

  publish-tiktoken-wasm:
    if: startsWith(github.ref, 'refs/tags/tiktoken-wasm-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: build wasm
        working-directory: tiktoken-wasm
        run: wasm-pack build --target web --release --scope goliapkg
      - name: publish to crates.io
        working-directory: tiktoken-wasm
        run: |
          set +e
          out=$(cargo publish --token ${{ secrets.CRATES_IO_TOKEN }} --allow-dirty 2>&1)
          rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && echo "$out" | grep -q "already exists on crates.io"; then
            echo "::notice::tiktoken-wasm version already published, treating as success"
            exit 0
          fi
          exit $rc
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: publish to npm
        working-directory: tiktoken-wasm/pkg
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    runs-on: ubuntu-latest
    needs: [publish-tiktoken, publish-tiktoken-wasm]
    if: always() && (needs.publish-tiktoken.result == 'success' || needs.publish-tiktoken-wasm.result == 'success')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: softprops/action-gh-release@v3
