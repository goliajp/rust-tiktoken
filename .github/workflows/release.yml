name: release

on:
  push:
    tags:
      - 'v*'                    # → publish tiktoken crate
      - 'tiktoken-wasm-v*'      # → publish tiktoken-wasm crate + npm
  # Re-run the wasm publish for an existing tiktoken-wasm-v<version> tag with
  # this workflow, e.g. after an npm failure. Re-running the original run would
  # use the workflow as it was at the tag.
  workflow_dispatch:
    inputs:
      version:
        description: 'tiktoken-wasm version to publish from its existing tag, e.g. 5.0.0'
        required: true

jobs:
  publish-tiktoken:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # tiktoken depends on the vocabulary data crates, so they go first. Their
      # versions change only when the data does; an unchanged one is already
      # on crates.io and is skipped.
      - name: publish vocabulary data crates
        run: |
          for dir in vocabs/*/; do
            [ -f "$dir/Cargo.toml" ] || continue
            set +e
            out=$(cargo publish --manifest-path "$dir/Cargo.toml" --token ${{ secrets.CRATES_IO_TOKEN }} 2>&1)
            rc=$?
            set -e
            echo "$out"
            if [ $rc -ne 0 ] && ! echo "$out" | grep -q "already exists on crates.io"; then
              exit $rc
            fi
          done
      - name: publish to crates.io
        run: |
          set +e
          out=$(cargo publish -p tiktoken --token ${{ secrets.CRATES_IO_TOKEN }} 2>&1)
          rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && echo "$out" | grep -q "already exists on crates.io"; then
            echo "::notice::tiktoken version already published, treating as success"
            exit 0
          fi
          exit $rc

  publish-tiktoken-wasm:
    if: startsWith(github.ref, 'refs/tags/tiktoken-wasm-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: the publish authenticates with this job's OIDC
      # token instead of a stored npm token
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('tiktoken-wasm-v{0}', inputs.version) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2.90.6
        with:
          tool: wasm-pack
      - name: build wasm
        working-directory: tiktoken-wasm
        run: wasm-pack build --target web --release --scope goliapkg
      # the wasm embeds every vocabulary, so the npm package carries their
      # licenses and notices as well as the crate's own
      - name: add license files to the npm package
        working-directory: tiktoken-wasm
        run: |
          cp -L LICENSE-MIT LICENSE-APACHE LICENSE-3RD-PARTY NOTICE pkg/
          cp -RL licenses pkg/
          node -e '
            const fs = require("fs")
            const p = JSON.parse(fs.readFileSync("pkg/package.json", "utf8"))
            p.files = [...new Set([...(p.files || []), "LICENSE-MIT", "LICENSE-APACHE", "LICENSE-3RD-PARTY", "NOTICE", "licenses"])]
            fs.writeFileSync("pkg/package.json", JSON.stringify(p, null, 2) + "\n")
          '
      - name: publish to crates.io
        working-directory: tiktoken-wasm
        run: |
          set +e
          out=$(cargo publish --token ${{ secrets.CRATES_IO_TOKEN }} --allow-dirty 2>&1)
          rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && echo "$out" | grep -q "already exists on crates.io"; then
            echo "::notice::tiktoken-wasm version already published, treating as success"
            exit 0
          fi
          exit $rc
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@^11.5.1
      - name: publish to npm
        working-directory: tiktoken-wasm/pkg
        run: npm publish --access public

  github-release:
    runs-on: ubuntu-latest
    needs: [publish-tiktoken, publish-tiktoken-wasm]
    if: always() && github.event_name == 'push' && (needs.publish-tiktoken.result == 'success' || needs.publish-tiktoken-wasm.result == 'success')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: softprops/action-gh-release@v3
