name: ci

on:
  push:
    # git-flow long-lived / integration branches. feature/* branches are
    # covered by the pull_request trigger when their PR (→ develop) is opened.
    branches: [master, develop, 'release/**', 'hotfix/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      # The property sweeps take their case count from PROPTEST_CASES and
      # default to a smoke sample. The committed proptest-regressions seeds
      # replay before any random case either way, so every input that ever
      # failed is still checked here; the full 20k/25k sweep is a release gate
      # run locally (see the Release section of the README). Left at the
      # default this job is minutes, not hours.
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc

  features:
    name: vocabulary feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # no vocabulary at all is a supported build (pricing tables only)
      - run: cargo build -p tiktoken --no-default-features
      # `cargo build` does not fail on warnings and the strict clippy job below
      # only runs default features, so the vocabulary-free build was free to
      # accumulate them — it had 27. Lint it here, where it is exercised.
      - run: cargo clippy -p tiktoken --lib --no-default-features -- -D warnings
      - run: cargo clippy -p tiktoken --lib --no-default-features --features vocab-o200k_base -- -D warnings
      # one vocabulary on its own, one that pulls in the base it extends, and a
      # mixed pair. `features_*` checks list_encodings()/get_encoding() agree;
      # `vocab_oracle` decodes whatever data the build carries and diffs it
      # against tests/vocab-oracle/.
      - run: cargo test -p tiktoken --lib --no-default-features --features vocab-o200k_base -- features_ vocab_oracle
      - run: cargo test -p tiktoken --lib --no-default-features --features vocab-glm5 -- features_ vocab_oracle
      - run: cargo test -p tiktoken --lib --no-default-features --features vocab-llama3 -- features_ vocab_oracle
      - run: cargo test -p tiktoken --lib --no-default-features --features vocab-p50k_base -- features_ vocab_oracle
      - run: cargo test -p tiktoken --lib --no-default-features --features vocab-kimi_k2,vocab-deepseek_v3 -- features_ vocab_oracle

  lint:
    name: fmt + clippy (lib strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Library code is strict. Tests/examples/benches surface pre-existing
      # cosmetic patterns (needless_borrows_for_generic_args, clone_on_copy,
      # criterion::black_box deprecation, …) from the airs/guirs mono; we
      # surface them as advisory only, not bundled into migration releases.
      - run: cargo clippy --workspace --lib -- -D warnings
      - run: cargo clippy --workspace --all-targets

  audit:
    name: audit + deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2.85.4
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny check
