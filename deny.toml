[graph]
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.93

[advisories]
version = 2
yanked = "deny"
# 'unmaintained' flags transitives we can't remove (e.g. `paste` under
# candle/tokenizers). Only gate on our own workspace members.
unmaintained = "workspace"

[bans]
multiple-versions = "warn"
wildcards = "deny"

# The vocabulary data crates ship their publishers' own licenses, which have
# no SPDX identifier. Name each one here and allow it for its crate only, so a
# custom license anywhere else in the graph still fails the check.
[[licenses.clarify]]
crate = "tiktoken-vocab-meta"
expression = "LicenseRef-Llama3-Community AND LicenseRef-Llama4-Community"
license-files = []

[[licenses.clarify]]
crate = "tiktoken-vocab-deepseek"
expression = "LicenseRef-DeepSeek-Model-1.0"
license-files = []

[[licenses.clarify]]
crate = "tiktoken-vocab-mistral"
expression = "Apache-2.0 AND LicenseRef-Mistral-Ecosystem-Open-Weight"
license-files = []

[[licenses.clarify]]
crate = "tiktoken-vocab-moonshot"
expression = "LicenseRef-Kimi-K2-Modified-MIT"
license-files = []

[[licenses.clarify]]
crate = "tiktoken-vocab-minimax"
expression = "LicenseRef-MiniMax-M2-Modified-MIT"
license-files = []

[[licenses.exceptions]]
crate = "tiktoken-vocab-meta"
allow = ["LicenseRef-Llama3-Community", "LicenseRef-Llama4-Community"]

[[licenses.exceptions]]
crate = "tiktoken-vocab-deepseek"
allow = ["LicenseRef-DeepSeek-Model-1.0"]

[[licenses.exceptions]]
crate = "tiktoken-vocab-mistral"
allow = ["LicenseRef-Mistral-Ecosystem-Open-Weight"]

[[licenses.exceptions]]
crate = "tiktoken-vocab-moonshot"
allow = ["LicenseRef-Kimi-K2-Modified-MIT"]

[[licenses.exceptions]]
crate = "tiktoken-vocab-minimax"
allow = ["LicenseRef-MiniMax-M2-Modified-MIT"]
