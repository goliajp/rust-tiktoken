[package]
name = "tiktoken"
description = "A high-performance pure-Rust implementation of OpenAI's tiktoken BPE tokenizer"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tiktoken"
version = "5.2.0"
edition.workspace = true
authors.workspace = true
keywords = ["tiktoken", "tokenizer", "bpe", "openai", "gpt"]
categories = ["text-processing", "algorithms"]
# Oracle fixtures, the `.tiktoken.zst` vocabulary references and the
# differential tests stay in the repository but are excluded from the published
# package: ~15 MB of reference data used only to validate this crate against
# upstream tokenizers. The vocabularies themselves ship in the tiktoken-vocab-*
# crates.
exclude = ["tests/", "examples/react-app/", "PERF-*.md", "SIZE-*.md"]

[features]
default = ["vocabs-all"]
# Long texts are encoded in parallel by default; the feature is kept, empty,
# so existing manifests that name it still build.
parallel = []

# Vocabularies are opt-out. The default pulls all of them, which is what every
# 3.x build shipped; turning off `default-features` and naming only the ones you
# use keeps the rest of the ~5 MB of vocabulary data out of your binary. Any
# encoding whose vocabulary is not compiled in simply disappears from
# `list_encodings()` and `get_encoding()` returns `None` for it.
vocabs-all = [
    "vocab-openai",
    "vocab-meta",
    "vocab-deepseek",
    "vocab-qwen",
    "vocab-mistral",
    "vocab-moonshot",
    "vocab-zhipu",
    "vocab-minimax",
]

# by vendor
vocab-openai = ["vocab-cl100k_base", "vocab-o200k_base", "vocab-p50k_base", "vocab-r50k_base"]
vocab-meta = ["vocab-llama3", "vocab-llama4"]
vocab-deepseek = ["vocab-deepseek_v3"]
vocab-qwen = ["vocab-qwen2", "vocab-qwen3_5"]
vocab-mistral = ["vocab-mistral_v3", "vocab-mistral_v15"]
vocab-moonshot = ["vocab-kimi_k2"]
vocab-zhipu = ["vocab-glm4", "vocab-glm5"]
vocab-minimax = ["vocab-minimax_m2"]

# by vocabulary. Each pulls in the data crate of its vendor (one crate per
# vendor, so cargo only downloads the vendors you use) and turns on that
# vocabulary in it. The three with a dependency are rank-aligned extensions of
# it and store only their tail, so enabling them enables the base as well.
vocab-cl100k_base = ["dep:tiktoken-vocab-openai", "tiktoken-vocab-openai/cl100k_base"]
vocab-o200k_base = ["dep:tiktoken-vocab-openai", "tiktoken-vocab-openai/o200k_base"]
vocab-r50k_base = ["dep:tiktoken-vocab-openai", "tiktoken-vocab-openai/r50k_base"]
vocab-p50k_base = ["vocab-r50k_base", "dep:tiktoken-vocab-openai", "tiktoken-vocab-openai/p50k_base"]
vocab-llama3 = ["vocab-cl100k_base", "dep:tiktoken-vocab-meta", "tiktoken-vocab-meta/llama3"]
vocab-llama4 = ["dep:tiktoken-vocab-meta", "tiktoken-vocab-meta/llama4"]
vocab-deepseek_v3 = ["dep:tiktoken-vocab-deepseek", "tiktoken-vocab-deepseek/deepseek_v3"]
vocab-qwen2 = ["dep:tiktoken-vocab-qwen", "tiktoken-vocab-qwen/qwen2"]
vocab-qwen3_5 = ["dep:tiktoken-vocab-qwen", "tiktoken-vocab-qwen/qwen3_5"]
vocab-mistral_v3 = ["dep:tiktoken-vocab-mistral", "tiktoken-vocab-mistral/mistral_v3"]
vocab-mistral_v15 = ["dep:tiktoken-vocab-mistral", "tiktoken-vocab-mistral/mistral_v15"]
vocab-kimi_k2 = ["dep:tiktoken-vocab-moonshot", "tiktoken-vocab-moonshot/kimi_k2"]
vocab-glm4 = ["dep:tiktoken-vocab-zhipu", "tiktoken-vocab-zhipu/glm4"]
vocab-glm5 = ["vocab-glm4", "dep:tiktoken-vocab-zhipu", "tiktoken-vocab-zhipu/glm5"]
vocab-minimax_m2 = ["dep:tiktoken-vocab-minimax", "tiktoken-vocab-minimax/minimax_m2"]

[dependencies]
ruzstd = "^0.9"
tiktoken-vocab-openai = { version = "1.0.0", path = "../vocabs/openai", optional = true }
tiktoken-vocab-meta = { version = "1.0.0", path = "../vocabs/meta", optional = true }
tiktoken-vocab-deepseek = { version = "1.0.0", path = "../vocabs/deepseek", optional = true }
tiktoken-vocab-qwen = { version = "1.0.0", path = "../vocabs/qwen", optional = true }
tiktoken-vocab-mistral = { version = "1.0.0", path = "../vocabs/mistral", optional = true }
tiktoken-vocab-moonshot = { version = "1.0.0", path = "../vocabs/moonshot", optional = true }
tiktoken-vocab-zhipu = { version = "1.0.0", path = "../vocabs/zhipu", optional = true }
tiktoken-vocab-minimax = { version = "1.0.0", path = "../vocabs/minimax", optional = true }

[dev-dependencies]
# only for reading the `tests/vocab-oracle/*.tiktoken.zst` reference files
base64 = "^0.23"
criterion = { version = "^0.8", features = ["html_reports"] }
proptest = "^1"
# reference implementation of the split patterns, and the source of the
# generated unicode tables
regex = "^1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "tokenize"
harness = false

[package.metadata.docs.rs]
all-features = true
