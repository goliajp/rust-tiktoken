[package]
name = "tiktoken"
description = "A high-performance pure-Rust implementation of OpenAI's tiktoken BPE tokenizer"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tiktoken"
version = "4.0.1"
edition.workspace = true
authors.workspace = true
keywords = ["tiktoken", "tokenizer", "bpe", "openai", "gpt"]
categories = ["text-processing", "algorithms"]
# Oracle fixtures, the `.tiktoken.zst` vocabulary references and the
# differential tests stay in the repository but are excluded from the published
# package: ~15 MB of reference data used only to validate this crate against
# upstream tokenizers, against a 10 MB crates.io package cap.
exclude = ["tests/", "examples/react-app/", "PERF-*.md", "SIZE-*.md"]

[features]
default = ["vocabs-all"]
parallel = ["rayon"]

# Vocabularies are opt-out. The default pulls all of them, which is what every
# 3.x build shipped; turning off `default-features` and naming only the ones you
# use keeps the rest of the ~5 MB of vocabulary data out of your binary. Any
# encoding whose vocabulary is not compiled in simply disappears from
# `list_encodings()` and `get_encoding()` returns `None` for it.
vocabs-all = [
    "vocab-openai",
    "vocab-meta",
    "vocab-deepseek",
    "vocab-qwen",
    "vocab-mistral",
    "vocab-moonshot",
    "vocab-zhipu",
    "vocab-minimax",
]

# by vendor
vocab-openai = ["vocab-cl100k_base", "vocab-o200k_base", "vocab-p50k_base", "vocab-r50k_base"]
vocab-meta = ["vocab-llama3"]
vocab-deepseek = ["vocab-deepseek_v3"]
vocab-qwen = ["vocab-qwen2"]
vocab-mistral = ["vocab-mistral_v3"]
vocab-moonshot = ["vocab-kimi_k2"]
vocab-zhipu = ["vocab-glm4", "vocab-glm5"]
vocab-minimax = ["vocab-minimax_m2"]

# by vocabulary. The three with a dependency are rank-aligned extensions of it
# and share its data file, so enabling them enables the base for free.
vocab-cl100k_base = []
vocab-o200k_base = []
vocab-r50k_base = []
vocab-p50k_base = ["vocab-r50k_base"]
vocab-llama3 = ["vocab-cl100k_base"]
vocab-deepseek_v3 = []
vocab-qwen2 = []
vocab-mistral_v3 = []
vocab-kimi_k2 = []
vocab-glm4 = []
vocab-glm5 = ["vocab-glm4"]
vocab-minimax_m2 = []

[dependencies]
rayon = { version = "^1", optional = true }
regex = "^1"
rustc-hash = "^2"
ruzstd = "^0.9"

[dev-dependencies]
# only for reading the `tests/vocab-oracle/*.tiktoken.zst` reference files
base64 = "^0.23"
criterion = { version = "^0.8", features = ["html_reports"] }
proptest = "^1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "tokenize"
harness = false

[package.metadata.docs.rs]
all-features = true
