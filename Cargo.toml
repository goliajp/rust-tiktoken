[workspace]
resolver = "3"
members = [
    "tiktoken",
    "bench-compare",
    "vocabs/openai",
    "vocabs/meta",
    "vocabs/deepseek",
    "vocabs/qwen",
    "vocabs/mistral",
    "vocabs/moonshot",
    "vocabs/zhipu",
    "vocabs/minimax",
]
exclude = ["tiktoken-wasm"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/goliajp/rust-tiktoken"
authors = ["GOLIA K.K.", "DoraCawl <doracawl@golia.jp>"]

[profile.release]
lto = true
codegen-units = 1

[profile.dev]
# debug=1 (line tables) instead of the default 2 (full DWARF). Backtraces keep
# file and line; what is lost is variable inspection in a debugger, which this
# project's workflow does not use. Measured 2026-08-28: target/debug/deps is
# the largest single thing on these machines — 104 GB in smix alone — and the
# debug info is most of it.
debug = 1
