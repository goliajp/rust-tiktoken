# Comparative benchmark harness: this crate vs tiktoken-rs, identical corpora
# and timing discipline (warmup + median of 9 rounds). A workspace member so
# it builds against the local tiktoken, but never published — tiktoken-rs is
# a competitor dependency that belongs nowhere near the shipped crate.
[package]
name = "bench-compare"
version = "0.0.0"
edition = "2024"
publish = false
# never published; the license satisfies cargo-deny's workspace-wide check
license = "MIT OR Apache-2.0"

[dependencies]
tiktoken = { path = "../tiktoken", version = "3.8.1" }
tiktoken-rs = "0.9"

[[bin]]
name = "bench-compare"
path = "src/main.rs"
