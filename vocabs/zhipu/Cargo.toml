[package]
name = "tiktoken-vocab-zhipu"
version = "1.0.0"
edition.workspace = true
repository.workspace = true
authors.workspace = true
license = "MIT"
description = "Zhipu AI GLM tokenizer vocabularies (glm4, glm5) for the tiktoken crate"
documentation = "https://docs.rs/tiktoken-vocab-zhipu"
keywords = ["tiktoken", "tokenizer", "bpe", "vocabulary"]
categories = ["text-processing"]

# Each vocabulary is behind its own feature, so a build carries only the ones
# its `tiktoken` features name. Nothing is on by default.
[features]
glm4 = []
glm5 = []
