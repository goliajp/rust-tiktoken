[package]
name = "tiktoken-vocab-deepseek"
version = "1.0.0"
edition.workspace = true
repository.workspace = true
authors.workspace = true
license-file = "LICENSE"
description = "DeepSeek tokenizer vocabularies (deepseek_v3) for the tiktoken crate"
documentation = "https://docs.rs/tiktoken-vocab-deepseek"
keywords = ["tiktoken", "tokenizer", "bpe", "vocabulary"]
categories = ["text-processing"]

# Each vocabulary is behind its own feature, so a build carries only the ones
# its `tiktoken` features name. Nothing is on by default.
[features]
deepseek_v3 = []
