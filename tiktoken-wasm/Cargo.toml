[package]
name = "tiktoken-wasm"
version = "3.7.1"
edition = "2024"
description = "WASM bindings for the tiktoken BPE tokenizer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/goliajp/rust-tiktoken"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tiktoken = { path = "../tiktoken", version = "3.7.1" }
wasm-bindgen = "^0.2"

# Optimize for speed, not size: ~97% of the artifact is embedded vocabulary
# data, so `-O3` on the code section costs a few hundred KB against 11 MB —
# while `-Os` was taxing every count()/encode() call in the browser.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-bulk-memory"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
